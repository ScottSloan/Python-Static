  test-macos-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - name: Prepare macOS runtime
        run: |
          # 下载 Python 静态运行时环境
          echo arch: $(uname -m)
          wget https://github.com/ScottSloan/Python-Static/releases/download/v0.0.2/macos_aarch64_runtime.zip
          unzip macos_aarch64_runtime.zip -d Bili23-Downloader
          chmod +x Bili23-Downloader/bili23-downloader
          chmod +x Bili23-Downloader/bundle/ffmpeg
          chmod +x Bili23-Downloader/runtime/python3.12

      - name: Download source code
        run: |
          # 下载源代码
          git clone https://github.com/ScottSloan/Bili23-Downloader.git Bili23-Downloader-Source
          mkdir -p Bili23-Downloader/script
          cp -r Bili23-Downloader-Source/src/* Bili23-Downloader/script

      - name: Test macOS runtime
        run: |
          cd Bili23-Downloader

          # 打印系统版本
          echo "System Version:"
          echo "macOS Version: $(sw_vers -productVersion)"
          echo "Kernel Version: $(uname -r)"

          # 测试 python
          echo ""
          echo "Python Runtime Test:"
          ./runtime/python3.12 -c "import sys; print(sys.executable); print(sys.version); import httpx; print(httpx.__version__); import PySide6; print(PySide6.__version__)"

          # 测试 ffmpeg
          echo ""
          echo "FFmpeg Test:"
          ./bundle/ffmpeg -version

          # 测试 loader
          echo ""
          echo "Loader Test:"
          ./bili23-downloader && sleep 5 && pkill -f bili23-downloader

      