name: Build Static Python Runtime
on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python 版本
        default: 3.13.13
      loader-ref:
        description: Bili23-Downloader-Loader 分支 / 标签
        default: main

jobs:
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: macos-latest

          - arch: x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build runtime
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          LOADER_REF: ${{ inputs.loader-ref }}
        run: ./build.sh

      - name: Check dynamic libraries
        run: |
          # 除系统库外不应依赖任何动态库（如 Homebrew）
          cd dist/macos_${{ matrix.arch }}_runtime
          otool -L bili23-downloader runtime/lib/python3.*/lib-dynload/*.so | grep -E '/(opt/homebrew|usr/local)/' && exit 1 || true

      - name: Test runtime
        run: |
          # 压缩包已生成，这里直接替换入口脚本做冒烟测试
          cd dist/macos_${{ matrix.arch }}_runtime
          echo 'import sys, ssl, lzma, decimal, sqlite3, ctypes; print(sys.version); print(ssl.OPENSSL_VERSION)' > _pystand_static.int
          ./bili23-downloader

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos_${{ matrix.arch }}_runtime
          path: dist/macos_${{ matrix.arch }}_runtime.zip
